<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AviControl Barsa 2.0</title>
    <!-- Tailwind via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@400;500;600;700;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap');
      
      body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: #111827; margin: 0; padding: 0; font-size: 14px; } 
      @media (max-width: 640px) {
        body { font-size: 13px; }
      }
      
      .font-corporate { font-family: 'Montserrat', sans-serif; }
      .font-youthful { font-family: 'Poppins', sans-serif; }

      input, select, textarea {
        color: #000000 !important;
        font-weight: 600;
      }
      .font-digital {
        font-family: 'Courier New', Courier, monospace;
        letter-spacing: -0.5px;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
